<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Stride</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="page" style="display:flex;flex-direction:column;">
  <div class="auth-topbar"><a href="landing.html" class="brand">Stride</a></div>

  <div class="auth-wrap">
    <div class="auth-col">
      <div>
        <h1>Welcome back</h1>
        <p class="lead">Log in to pick up where you left off.</p>
      </div>

      <form class="auth-card" id="login-form" novalidate>
        <p class="auth-error" id="login-error"></p>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button class="auth-submit" type="submit" id="login-submit">Log in</button>
      </form>

      <p class="auth-foot">New to Stride? <a href="signup.html">Create an account</a></p>
    </div>
  </div>
</div>
<script src="js/auth.js"></script>
</body>
</html>
