<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="_ds/organic-4c858df5-76c5-4f95-8847-15279404b8d8/styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-700); }
</style>
</helmet>

<div style="min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);overflow:hidden;position:relative;">

  <div style="position:absolute;right:-140px;top:-180px;width:400px;height:400px;border-radius:50%;background:var(--color-accent-2-200);z-index:0;"></div>

  <div style="position:relative;z-index:1;display:flex;align-items:center;gap:26px;padding:26px 44px;">
    <span style="font-family:var(--font-heading);font-size:20px;margin-right:auto;">Stride</span>
    <a href="Login.dc.html" style="font-size:14px;text-decoration:none;color:var(--color-text);">Log in</a>
    <a href="Signup.dc.html" style="font-family:var(--font-heading);font-size:14px;text-decoration:none;background:var(--color-accent);color:var(--color-bg);padding:11px 24px;border-radius:999px;">Create account</a>
  </div>

  <div style="position:relative;z-index:1;max-width:640px;padding:70px 44px 100px;">
    <h1 style="font-family:var(--font-heading);font-weight:400;font-size:clamp(38px,5.5vw,64px);line-height:1.1;margin:0 0 24px;">
      <span style="display:block;">Every rep,</span>
      <span style="display:block;">right here.</span>
    </h1>
    <p style="font-size:17px;line-height:1.6;color:color-mix(in srgb, var(--color-text) 75%, transparent);max-width:46ch;margin:0 0 32px;">
      A stopwatch for your workout, a reason to keep going, and a record of how far you've come — one simple page, nothing to configure.
    </p>
    <div style="display:flex;gap:14px;flex-wrap:wrap;">
      <a href="Signup.dc.html" style="font-family:var(--font-heading);font-size:15px;text-decoration:none;background:var(--color-accent);color:var(--color-bg);padding:13px 28px;border-radius:999px;">Create free account</a>
      <a href="Login.dc.html" style="font-family:var(--font-heading);font-size:15px;text-decoration:none;color:var(--color-text);border:1px solid var(--color-divider);padding:13px 28px;border-radius:999px;">Log in</a>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:44px;">
      <span style="font-size:11px;letter-spacing:0.02em;padding:5px 14px;border-radius:12px;background:var(--color-accent-100);color:var(--color-accent-700);">Live stopwatch</span>
      <span style="font-size:11px;letter-spacing:0.02em;padding:5px 14px;border-radius:12px;background:var(--color-accent-2-100);color:var(--color-accent-2-700);">Daily motivation</span>
      <span style="font-size:11px;letter-spacing:0.02em;padding:5px 14px;border-radius:12px;background:var(--color-accent-100);color:var(--color-accent-700);">Your history, tracked</span>
    </div>
  </div>

</div>

</x-dc>
</body>
</html>
